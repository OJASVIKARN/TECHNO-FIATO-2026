<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · Technofiato 2026</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
  <style>
    html,body{margin:0;height:100%;background:#0a0a0a;font-family:sans-serif;}
    .wrap{width:100%;max-width:920px;margin:0 auto;padding:24px;box-sizing:border-box;}
    .frame-host{position:relative;width:100%;height:calc(100vh - 48px);min-height:1100px;background:#0a0a0a;}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0a0a0a;}
    @media (max-width:700px){
      .wrap{padding:12px;}
      .frame-host{height:calc(100vh - 24px);min-height:1400px;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="frame-host">
      <iframe src="https://tally.so/embed/b51QWZ?hideTitle=1&transparentBackground=1" loading="lazy" title="Registration form"></iframe>
    </div>
  </div>
</body>
</html>
